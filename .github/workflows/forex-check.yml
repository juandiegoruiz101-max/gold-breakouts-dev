name: forex-check
on:
  schedule:
    # every 5 min, weekdays (repo is public -> Actions minutes are free)
    - cron: "*/5 * * * 1-5"
  workflow_dispatch: {}
concurrency:
  group: forex-check
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python3 -m movers.scan watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
